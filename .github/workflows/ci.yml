name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  frontend:
    name: "Frontend: lint, typecheck, unit tests, build"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Lint
        working-directory: frontend
        run: npm run lint

      - name: Typecheck
        working-directory: frontend
        run: npm run typecheck

      - name: Unit tests
        working-directory: frontend
        run: npm run test

      - name: Build
        working-directory: frontend
        run: npm run build

  backend:
    name: "Backend: lint, typecheck, tests"
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: lumen_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      # The SQL migrations own the schema: the inherited ones under
      # db/migrations/ and this project's under backend/migrations/.
      # They are applied below, in that order, before the tests run.
      TEST_DATABASE_URL: postgresql+asyncpg://postgres:postgres@127.0.0.1:5432/lumen_test
      JWT_SECRET: ci-jwt-secret-with-enough-entropy-for-hs256
      CORS_ALLOWED_ORIGINS: http://localhost:8080

    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
          enable-cache: true
          cache-dependency-glob: backend/uv.lock

      - name: Install dependencies
        working-directory: backend
        run: uv sync --frozen --extra dev

      - name: Apply the schema
        run: |
          psql "postgresql://postgres:postgres@127.0.0.1:5432/lumen_test" \
            -v ON_ERROR_STOP=1 -q -f db/platform-shim.sql
          for directory in db/migrations backend/migrations; do
            for migration in $(ls "$directory"/*.sql | sort); do
              echo "applying $migration"
              psql "postgresql://postgres:postgres@127.0.0.1:5432/lumen_test" \
                -v ON_ERROR_STOP=1 -q -f "$migration"
            done
          done

      - name: Format
        working-directory: backend
        run: uv run --no-sync ruff format --check .

      - name: Lint
        working-directory: backend
        run: uv run --no-sync ruff check .

      - name: Typecheck
        working-directory: backend
        run: uv run --no-sync mypy app tests

      - name: Tests
        working-directory: backend
        run: uv run --no-sync pytest -q

  e2e:
    name: E2E (Playwright)
    runs-on: ubuntu-latest
    needs: [frontend, backend]

    # The panel is walked with a real session: the tests sign in and
    # read the data of the school, so they need the schema, the seed
    # and the API running.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: lumen_e2e
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/lumen_e2e
      JWT_SECRET: ci-jwt-secret-with-enough-entropy-for-hs256
      # The origin of the dev server that Playwright starts.
      CORS_ALLOWED_ORIGINS: http://localhost:5174
      # The API is addressed by the same host as the site: the browser
      # treats `127.0.0.1` and `localhost` as two different sites, and
      # the cookie of the session would not travel with the request.
      VITE_API_URL: http://localhost:8011

    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
          enable-cache: true
          cache-dependency-glob: backend/uv.lock

      - name: Install the backend
        working-directory: backend
        run: uv sync --frozen --extra dev

      - name: Apply the schema and the seed
        run: |
          psql "postgresql://postgres:postgres@127.0.0.1:5432/lumen_e2e" \
            -v ON_ERROR_STOP=1 -q -f db/platform-shim.sql
          for directory in db/migrations backend/migrations; do
            for migration in $(ls "$directory"/*.sql | sort); do
              echo "applying $migration"
              psql "postgresql://postgres:postgres@127.0.0.1:5432/lumen_e2e" \
                -v ON_ERROR_STOP=1 -q -f "$migration"
            done
          done
          psql "postgresql://postgres:postgres@127.0.0.1:5432/lumen_e2e" \
            -v ON_ERROR_STOP=1 -q -f db/seed.sql
          for seed in $(ls backend/seeds/*.sql | sort); do
            echo "seeding $seed"
            psql "postgresql://postgres:postgres@127.0.0.1:5432/lumen_e2e" \
              -v ON_ERROR_STOP=1 -q -f "$seed"
          done

      - name: Start the API
        working-directory: backend
        run: |
          nohup uv run --no-sync uvicorn app.main:app --host 127.0.0.1 --port 8011 \
            > /tmp/api.log 2>&1 &
          for _ in $(seq 1 60); do
            if curl -sf http://127.0.0.1:8011/health > /dev/null; then
              echo "the API is up"
              exit 0
            fi
            sleep 1
          done
          echo "the API did not start:" >&2
          cat /tmp/api.log >&2
          exit 1

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Install Playwright browsers
        working-directory: frontend
        # --no-install forces npx to use the project's own Playwright.
        # Without it, npx downloads the latest release and installs a
        # browser the test runner does not know about.
        run: npx --no-install playwright install --with-deps chromium

      - name: Build
        working-directory: frontend
        run: npm run build

      - name: E2E tests
        working-directory: frontend
        run: npm run test:e2e

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 7
