[project]
name = "lumen-backend"
version = "0.1.0"
description = "Lumen FastAPI backend (Python functional style, uv-managed)."
requires-python = ">=3.12"
readme = "README.md"
license = { text = "Proprietary" }

dependencies = [
    "fastapi>=0.115.0,<0.130",
    "uvicorn[standard]>=0.34.0",
    "pydantic>=2.10.0,<2.13",
    "pydantic[email]>=2.10.0,<2.13",
    "pydantic-settings>=2.7.0",
    "httpx>=0.27.0,<0.28",
    "anyio>=4.4.0,<4.7",
    "python-dateutil>=2.9.0",
    # --- Phase 0: data layer ---
    "sqlalchemy[asyncio]>=2.0.36,<2.1",
    "asyncpg>=0.30.0,<0.31",
    "greenlet>=3.1.0",
    # --- Phase 1: auth ---
    "argon2-cffi>=23.1.0,<26",
    "pyjwt>=2.10.0,<3",
    # --- Phase 1: migrations ---
    "alembic>=1.14.0,<2",
    # Alembic runs migrations on a synchronous connection, so it
    # needs the sync Postgres driver even though the app uses asyncpg.
    "psycopg[binary]>=3.2.0,<4",
    "bcrypt>=4.1.0,<6",
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0,<8.4",
    "pytest-asyncio>=0.24.0,<1.0",
    "ruff>=0.8.0",
    "mypy>=1.13.0",
    "types-python-dateutil>=2.9.0",
]

[project.scripts]
lumen-api = "app.main:run"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "F",   # pyflakes
    "I",   # isort
    "B",   # bugbear
    "UP",  # pyupgrade
    "SIM", # simplify
]
ignore = ["E501"]  # line length is handled by the formatter

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["-ra", "--strict-markers"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.mypy]
python_version = "3.12"
strict = true
files = ["app", "tests"]
ignore_missing_imports = true
plugins = ["pydantic.mypy", "sqlalchemy.ext.mypy.plugin"]

# The application code is held to strict typing. The test suite is
# held to a lighter standard: tests read better without annotations on
# every fixture parameter, and the fixtures themselves are untyped by
# nature (pytest injects them at runtime).
[[tool.mypy.overrides]]
module = ["tests.*"]
disallow_untyped_defs = false
disallow_untyped_decorators = false
disallow_incomplete_defs = false
no_implicit_optional = false
check_untyped_defs = true
warn_return_any = false
