project_id = "lumen-dev"

# ---------------------------------------------------------------------------
# Phase 1 schema migrations live in supabase/migrations/. They are applied
# to the remote project via the Supabase MCP / CLI in CI and locally via
# `supabase db reset`. Order matters; filenames are timestamps.
# ---------------------------------------------------------------------------

[api]
enabled = true
port = 54321
schemas = ["public", "storage"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 17

[db.pooler]
enabled = false

[realtime]
enabled = true

[studio]
enabled = true
port = 54323

[storage]
enabled = true
file_size_limit = "50MiB"

[auth]
enabled = true
site_url = "http://localhost:8080"
additional_redirect_urls = ["http://localhost:8080", "http://localhost:5173"]
jwt_expiry = 3600
enable_signup = false   # colegio admins are created via backend, not self-signup
enable_anonymous_sign_ins = false

[auth.email]
enable_signup = false
double_confirm_changes = true
enable_confirmations = false   # confirmation done by admin invitation

[edge_runtime]
enabled = false

[experimental]
orioledb_version = ""
